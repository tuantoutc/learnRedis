server:
  port: 8081

spring:
  application:
    name: TestRedis
  datasource:
    url: jdbc:postgresql://localhost:5432/dbRedis
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379